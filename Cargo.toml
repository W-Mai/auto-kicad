[workspace]
members = [
    "crates/auto-kicad",
    "crates/kicad-adapter",
    "crates/kicad-checks",
    "crates/kicad-ipc",
    "crates/kicad-engine",
    "crates/kicad-geometry",
    "crates/kicad-model",
    "crates/kicad-schematic",
    "crates/runtime",
]
resolver = "3"

# Keep native executable verification fast in development and acceptance builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
