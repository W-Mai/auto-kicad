[package]
name = "kicad-adapter"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
runtime = { path = "../runtime" }
schemars = "1"
protobuf = "3"
kicad-checks = { path = "../kicad-checks" }
kicad-engine = { path = "../kicad-engine" }
kicad-ipc = { path = "../kicad-ipc" }
kicad-model = { path = "../kicad-model" }
kicad-schematic = { path = "../kicad-schematic" }
hex = "0.4"
kiutils_sexpr = "=0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nng = "1"
serde_json = "1"
