[package]
name = "kicad-checks"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
runtime = { path = "../runtime" }
schemars = "1"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
