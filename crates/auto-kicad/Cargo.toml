[package]
name = "auto-kicad"
version = "0.1.0"
edition = "2024"
default-run = "auto-kicad"

[dependencies]
kicad-checks = { path = "../kicad-checks" }
kicad-adapter = { path = "../kicad-adapter" }
kicad-engine = { path = "../kicad-engine" }
kicad-ipc = { path = "../kicad-ipc" }
kicad-model = { path = "../kicad-model" }
kicad-schematic = { path = "../kicad-schematic" }
hex = "0.4"
rmcp = { version = "3.1.4", features = ["client", "server", "transport-io"] }
runtime = { path = "../runtime" }
schemars = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

libc = "0.2"
