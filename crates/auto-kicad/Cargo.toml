[package]
name = "auto-kicad"
version = "0.1.0"
edition = "2024"

[dependencies]
kicad-adapter = { path = "../kicad-adapter" }
kicad-ipc = { path = "../kicad-ipc" }
kicad-model = { path = "../kicad-model" }
rmcp = { version = "3.1.4", features = ["client", "server", "transport-io"] }
runtime = { path = "../runtime" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
